name: 🎬 Generate Videos

on:
  workflow_dispatch:
    inputs:
      language:
        description: 'Select Language'
        required: true
        type: choice
        options:
          - ENGLISH
          - KANNADA
          - HINDI
          - TAMIL
          - TELUGU
          - MARATHI
      start:
        description: 'Start file number'
        required: true
        type: string
        default: '1'
      end:
        description: 'End file number'
        required: true
        type: string
        default: '3'

jobs:
  generate-videos:
    name: Generate ${{ inputs.language }} Videos (${{ inputs.start }}-${{ inputs.end }})
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔧 Install System Dependencies
        run: |
          echo "Installing gdown..."
          brew install gdown
          echo "Installing ffmpeg..."
          brew install ffmpeg
          echo "Installing gdrive..."
          brew tap prasmussen/gdrive
          brew install gdrive || echo "gdrive install failed, trying alternate method"

      - name: 📂 Setup Google Drive Authentication
        env:
          GDRIVE_TOKEN: ${{ secrets.GDRIVE_TOKEN }}
        run: |
          mkdir -p ~/.gdrive
          echo "$GDRIVE_TOKEN" > ~/.gdrive/token_v2.json
          echo "✓ Google Drive authentication configured"

      - name: 📥 Download Media from Google Drive
        run: |
          echo "Downloading ${{ inputs.language }} media files (${{ inputs.start }}-${{ inputs.end }})"
          python3 download_from_gdrive.py \
            --language ${{ inputs.language }} \
            --start ${{ inputs.start }} \
            --end ${{ inputs.end }}

      - name: 📊 Verify Downloaded Files
        run: |
          echo "Images in input folder:"
          ls -lh input/images/ || echo "No images folder or empty"
          echo ""
          echo "Audio in input folder:"
          ls -lh input/audio/ || echo "No audio folder or empty"

      - name: 🎬 Generate Videos
        run: |
          echo "Starting video generation..."
          python3 generate_videos_with_bg.py
          echo "✓ Video generation complete"

      - name: 📊 List Generated Videos
        run: |
          echo "Generated videos:"
          ls -lh output/*.mp4 || echo "No videos generated"

      - name: 📤 Upload Videos to Google Drive
        run: |
          echo "Uploading ${{ inputs.language }} videos to Google Drive..."
          python3 upload_to_gdrive.py \
            --language ${{ inputs.language }} \
            --delete
          echo "✓ Upload complete, local files deleted"

      - name: ✅ Summary
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ SUCCESS!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Language: ${{ inputs.language }}"
          echo "Range: ${{ inputs.start }} to ${{ inputs.end }}"
          echo "Videos uploaded to Google Drive"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ❌ Failure Notice
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ WORKFLOW FAILED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Check the logs above for error details"
          echo "Common issues:"
          echo "  - Google Drive folder IDs not configured"
          echo "  - Files not found in Google Drive"
          echo "  - Authentication token expired"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
